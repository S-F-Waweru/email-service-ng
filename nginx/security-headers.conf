# Included in every location: nginx drops server-level add_header lines in a
# location that has its own add_header, so they are repeated via this file.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS belongs on whatever terminates HTTPS (host nginx, load balancer), not
# here, since this container serves plain HTTP.
