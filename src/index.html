<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Helapay Email Service</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="brand/helapay-mark.svg">
  <script>
    // Apply dark mode before Angular loads so there is no white flash.
    // Must match THEME_MODE_STORAGE_KEY in src/app/theme/theme.service.ts.
    (function () {
      var mode = 'system';
      try { mode = localStorage.getItem('theme-mode') || 'system'; } catch (e) {}
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
