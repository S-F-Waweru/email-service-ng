<hlm-dialog [state]="user() ? 'open' : 'closed'" (stateChanged)="onState($event)">
  <hlm-dialog-content *hlmDialogPortal="let ctx" class="sm:max-w-md">
    <hlm-dialog-header>
      <h2 hlmDialogTitle>Reset password for {{ user()?.fullName }}</h2>
      <p hlmDialogDescription>
        They aren't notified. Copy the new password and share it securely. Sessions already open stay signed in.
      </p>
    </hlm-dialog-header>

    <div class="grid gap-1.5">
      <label hlmLabel for="new-password">New password</label>
      <div hlmInputGroup>
        <input
          hlmInputGroupInput
          id="new-password"
          type="text"
          class="font-mono"
          autocomplete="new-password"
          [value]="password()"
          (input)="password.set($any($event.target).value); error.set('')"
          [attr.aria-invalid]="error() ? true : null"
        />
        <div hlmInputGroupAddon align="inline-end">
          <button hlmInputGroupButton type="button" size="icon-xs" aria-label="Copy password" (click)="copy()">
            <ng-icon name="lucideCopy" />
          </button>
          <button hlmInputGroupButton type="button" (click)="generate()">
            <ng-icon name="lucideWandSparkles" />
            Generate
          </button>
        </div>
      </div>
      @if (error()) {
        <p class="text-destructive text-xs">{{ error() }}</p>
      } @else {
        <p class="text-muted-foreground text-xs">At least {{ min }} characters.</p>
      }
    </div>

    <hlm-dialog-footer>
      <button hlmBtn variant="outline" type="button" (click)="closed.emit()" [disabled]="store.busy()">Cancel</button>
      <button hlmBtn type="button" (click)="save()" [disabled]="store.busy()">
        @if (store.busy()) {
          <hlm-spinner class="size-4" />
        }
        Set password
      </button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
